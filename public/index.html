<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convenus</title>
<meta name="description" content="Baixe vídeos, músicas, fotos e perfis do YouTube, X, Instagram, TikTok, Bluesky e mais. Sem propaganda.">
<meta name="theme-color" content="#e9edf2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  try { const t = localStorage.getItem('gc-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --page: #e9edf2;
    --card: #f5f7fa;
    --fill: #e9edf2;
    --fill-hover: #ffffff;
    --ink: #3b414d;
    --mut: #646b78;
    --ac: #f2734f;
    --ac-text: #c2461f;
    --ac-soft: #fde4dc;
    --cta: #c94a24;
    --cta-ink: #ffffff;
    --ok: #2f8f63;
    --err: #b8382e;
    --shadow: 0 1px 2px rgb(30 40 60 / .04), 0 12px 32px -18px rgb(30 40 60 / .18);
    --pf: var(--ac);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1b1e25; --card: #23272f; --fill: #2c313b; --fill-hover: #353b47;
      --ink: #e7e9ee; --mut: #9ea5b2; --ac: #f2734f; --ac-text: #ff9a7a; --ac-soft: #4a2c25;
      --cta: #f2734f; --cta-ink: #1b1e25; --ok: #5fcf98; --err: #ff8a80;
      --shadow: 0 1px 2px rgb(0 0 0 / .2), 0 14px 34px -18px rgb(0 0 0 / .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #1b1e25; --card: #23272f; --fill: #2c313b; --fill-hover: #353b47;
    --ink: #e7e9ee; --mut: #9ea5b2; --ac: #f2734f; --ac-text: #ff9a7a; --ac-soft: #4a2c25;
    --cta: #f2734f; --cta-ink: #1b1e25; --ok: #5fcf98; --err: #ff8a80;
    --shadow: 0 1px 2px rgb(0 0 0 / .2), 0 14px 34px -18px rgb(0 0 0 / .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 28px; }
  .mut { color: var(--mut); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { flex: none; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 13px; }

  .layout { display: grid; gap: 28px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  @media (min-width: 1000px) {
    .wrap { padding: 52px 40px 56px; gap: 40px; }
    .layout { grid-template-columns: minmax(0, 1fr) 400px; gap: 40px; }
    .brand h1 { font-size: 24px; }
    .brand p { font-size: 14px; }
  }

  .card { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); animation: rise .7s cubic-bezier(.22,1,.36,1) both; transition: background .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

  .k {
    font: inherit; font-weight: 500; color: var(--ink); background: var(--fill); border: 0; cursor: pointer;
    border-radius: 14px; padding: 11px 16px; text-decoration: none; text-align: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .25s, color .25s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .k:hover { background: var(--fill-hover); color: var(--ac-text); transform: translateY(-2px); }
  .k:active { transform: translateY(0) scale(.98); }
  .k[aria-pressed="true"], .k[aria-selected="true"] { background: var(--ac-soft); color: var(--ac-text); transform: none; }
  .k:disabled { opacity: .5; cursor: default; transform: none; }
  .k small { color: var(--mut); font-weight: 400; font-size: 12px; }
  .k:focus-visible, .cta:focus-visible, input:focus-visible, .tile:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .icon-btn { width: 46px; height: 46px; padding: 0; flex: none; }

  .cta {
    font: inherit; font-weight: 600; font-size: 16px; width: 100%; padding: 17px; border: 0; border-radius: 18px; cursor: pointer;
    background: var(--cta); color: var(--cta-ink); display: flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; transition: transform .3s cubic-bezier(.34,1.56,.64,1), filter .25s;
  }
  .cta:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .cta:active { transform: scale(.99); }
  .cta:disabled { opacity: .6; cursor: default; transform: none; }

  /* entrada */
  .search { padding: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .field { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--fill); border-radius: 16px; padding: 0 16px; }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 0; outline: none; padding: 15px 0; }
  .field input::placeholder { color: var(--mut); }
  .search > .k { padding: 15px 22px; flex: 0 0 auto; }
  @media (max-width: 520px) { .search > .k { flex: 1 1 100%; } }
  .loading { display: flex; align-items: center; gap: 10px; padding: 4px 6px 2px; font-size: 14px; width: 100%; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--fill); border-top-color: var(--pf); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sites { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px; font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 99px; padding: 3px 10px 3px 8px; font-size: 12px; color: var(--mut); transition: background .25s, color .25s; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--mut)); flex: none; }
  .pill.on { background: color-mix(in srgb, var(--c) 16%, var(--fill)); color: var(--ink); }
  .msg-err { width: 100%; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); font-size: 14px; }

  /* post */
  .post { padding: 20px; }
  .phead { display: flex; flex-direction: column; gap: 18px; }
  .cover { position: relative; border-radius: 18px; overflow: hidden; background: var(--fill); aspect-ratio: 16 / 9; width: 100%; flex: none; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .dur { position: absolute; right: 10px; bottom: 10px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 8px; background: rgb(0 0 0 / .55); color: #fff; }
  .ptitle { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--fill); }
  .who .k { padding: 5px 11px; font-size: 12px; border-radius: 10px; }
  @media (min-width: 640px) {
    .post { padding: 30px; }
    .phead { flex-direction: row; align-items: center; gap: 26px; }
    .cover { width: 296px; }
    .ptitle { font-size: 20px; }
  }

  .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 640px) { .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { display: flex; flex-direction: column; gap: 8px; border-radius: 18px; padding: 6px; background: transparent; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background .25s; animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
  .tile.sel { background: var(--ac-soft); }
  .tile .pic { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--fill); position: relative; display: flex; align-items: center; justify-content: center; color: var(--mut); }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s cubic-bezier(.22,1,.36,1); }
  .tile:hover .pic img { transform: scale(1.05); }
  .tile .tag { position: absolute; left: 8px; bottom: 8px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 7px; background: rgb(0 0 0 / .55); color: #fff; display: inline-flex; gap: 4px; align-items: center; }
  .tile .play { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: rgb(0 0 0 / .45); display: flex; align-items: center; justify-content: center; color: #fff; }
  .tile .k { width: 100%; padding: 9px; font-size: 13px; }
  .tile.sel .k { background: var(--card); }

  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 22px; }
  .tabs .k { flex-direction: column; gap: 6px; padding: 16px 6px; border-radius: 18px; font-size: 15px; }
  .label { font-size: 13px; margin: 0 0 12px; }
  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
  @media (min-width: 640px) { .chips { display: flex; flex-wrap: wrap; gap: 12px; } .chips .k { padding: 11px 18px; } }
  .note { font-size: 12px; margin: -12px 0 20px; }
  .thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 640px) { .thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); } .thumbs .k { flex-direction: column; gap: 0; } }
  .sec { margin-top: 28px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sec-head .label { margin: 0; }
  .sec-head .k { padding: 7px 12px; font-size: 12px; border-radius: 10px; }

  /* perfil */
  .profile { padding: 12px; overflow: hidden; }
  .banner { border-radius: 18px; background: var(--fill); aspect-ratio: 4 / 1; min-height: 80px; overflow: hidden; }
  .banner.none { aspect-ratio: auto; min-height: 64px; background: color-mix(in srgb, var(--pf) 14%, var(--fill)); }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chead { display: flex; align-items: flex-end; gap: 14px; margin: -30px 12px 0; position: relative; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--card); padding: 5px; flex: none; }
  .avatar img, .avatar span { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: var(--fill); }
  .cname { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .cbtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 12px 12px; }

  /* conversões */
  .jobs { padding: 22px; }
  .jobs-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; }
  .jobs-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .jobs-head .k { padding: 8px 14px; font-size: 13px; }
  .job-list { display: flex; flex-direction: column; gap: 20px; }
  .job { display: flex; flex-direction: column; gap: 10px; animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
  .job-row { display: flex; align-items: center; gap: 12px; }
  .job-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; justify-content: center; flex: none; color: var(--mut); }
  .job-ico.ok { color: var(--ok); }
  .job-ico.err { color: var(--err); }
  .job-ico.run { color: var(--ac); }
  .job-main { flex: 1; min-width: 0; }
  .job-name { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-sub { font-size: 12px; color: var(--mut); }
  .job-sub.err { color: var(--err); }
  .job-pct { font-size: 13px; font-weight: 600; color: var(--ac-text); flex: none; }
  .job .k.icon-btn { width: 42px; height: 42px; border-radius: 50%; }
  .track { height: 8px; border-radius: 99px; background: var(--fill); margin-left: 52px; }
  .track i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--ac); position: relative; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .track i::after { content: ""; position: absolute; right: -7px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 4px var(--card); animation: pulse 1.6s ease-in-out infinite; }
  .track.busy i { width: 100% !important; animation: breathe 1.4s ease-in-out infinite; }
  .track.busy i::after { display: none; }
  @keyframes pulse { 50% { transform: scale(.75); } }
  @keyframes breathe { 50% { opacity: .4; } }
  .empty { text-align: center; padding: 18px 8px 8px; font-size: 14px; }
  .empty svg { display: block; margin: 0 auto 10px; color: var(--mut); opacity: .6; }
  footer { text-align: center; font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="50" height="50" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#f2734f"/><path d="M11 34a21 21 0 0 1 42 0L32 53z" fill="#fff"/><path d="M32 53L17.5 21M32 53L24.5 15.5M32 53V13M32 53l7.5-37.5M32 53l14.5-32" fill="none" stroke="#f2734f" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div>
        <h1>Convenus</h1>
        <p class="mut">Vídeos, músicas, fotos e perfis — sem propaganda</p>
      </div>
    </div>
    <button class="k icon-btn" id="theme" type="button" aria-label="Trocar tema">
      <svg id="themeIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>
    </button>
  </header>

  <div class="layout">
    <div class="col">
      <form class="card search" id="form" autocomplete="off">
        <label for="url" class="sr">Link</label>
        <div class="field">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="mut" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          <input type="url" id="url" placeholder="Cola um link de vídeo, post ou perfil" inputmode="url" required>
        </div>
        <button class="k" type="button" id="paste">Colar</button>
        <div class="sites" id="sites"></div>
        <div class="loading mut" id="loading" hidden><span class="spin"></span><span id="loadingText">Buscando…</span></div>
        <div class="msg-err" id="formErr" hidden></div>
      </form>

      <section class="card post" id="post" hidden>
        <div class="phead">
          <div class="cover" id="cover"><img id="pCover" alt="" referrerpolicy="no-referrer"><span class="dur" id="pDur"></span></div>
          <div style="min-width:0;flex:1">
            <h2 class="ptitle" id="pTitle"></h2>
            <div class="who mut" id="pWho"></div>
          </div>
        </div>

        <div class="sec" id="gallerySec" hidden>
          <div class="sec-head">
            <p class="label mut" id="galleryLabel"></p>
            <button class="k" type="button" id="allPhotos" hidden></button>
          </div>
          <div class="gallery" id="gallery"></div>
        </div>

        <div class="sec" id="convert" hidden>
          <p class="label mut" id="convertLabel" hidden></p>
          <div class="tabs" role="tablist" aria-label="Formato"></div>
          <p class="label mut" id="qLabel">Qualidade</p>
          <div class="chips" id="chips"></div>
          <p class="note mut" id="note" hidden></p>
          <div id="goWrap"></div>
        </div>

        <div class="sec" id="thumbsSec" hidden>
          <p class="label mut">Baixar capa</p>
          <div class="thumbs" id="thumbs"></div>
        </div>
      </section>

      <section class="card profile" id="profile" hidden>
        <div class="banner" id="cBanner"></div>
        <div class="chead">
          <div class="avatar" id="cAvatar"></div>
          <div style="padding-bottom:4px;min-width:0">
            <div class="cname" id="cName"></div>
            <div class="mut" style="font-size:13px" id="cMeta"></div>
          </div>
        </div>
        <div class="cbtns">
          <a class="k" id="cAvatarBtn" download>Baixar foto de perfil</a>
          <a class="k" id="cBannerBtn" download>Baixar banner</a>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="card jobs" style="animation-delay:.1s">
        <div class="jobs-head">
          <h2>Conversões</h2>
          <button class="k" type="button" id="clear" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Limpar
          </button>
        </div>
        <div class="job-list" id="jobs"></div>
        <div class="empty mut" id="empty">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          Nada por aqui ainda.<br>Cola um link pra começar.
        </div>
      </section>
      <footer class="mut">Os arquivos convertidos somem em 1 hora.</footer>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { info: null, url: '', sel: 0, kind: 'mp4', quality: { mp4: null, mp3: '320' }, variant: 0, jobs: [] };
const RES_NAMES = { 4320: '8K', 2160: '4K', 1440: '2K', 1080: 'Full HD', 720: 'HD' };
const ACTIVE = ['queued', 'running'];

// Plataformas: nome, cor e como reconhecer pelo link.
const PLATFORMS = [
  { name: 'YouTube', color: '#ff3b30', re: /(^|\.)(youtube\.com|youtu\.be)$/ },
  { name: 'X', label: 'X / Twitter', color: '#8b98a5', re: /(^|\.)(x\.com|twitter\.com|fxtwitter\.com|vxtwitter\.com|fixupx\.com)$/ },
  { name: 'Instagram', color: '#e1306c', re: /(^|\.)instagram\.com$/ },
  { name: 'TikTok', color: '#25c4c0', re: /(^|\.)tiktok\.com$/ },
  { name: 'Bluesky', color: '#1185fe', re: /(^|\.)bsky\.app$/ },
  { name: 'Facebook', color: '#1877f2', re: /(^|\.)(facebook\.com|fb\.watch)$/ },
  { name: 'SoundCloud', color: '#ff5500', re: /(^|\.)soundcloud\.com$/ },
  { name: 'Twitch', color: '#9146ff', re: /(^|\.)twitch\.tv$/ },
  { name: 'Pinterest', color: '#e60023', re: /(^|\.)(pinterest\.[a-z.]+|pin\.it)$/ },
  { name: 'Streamable', color: '#0f90fa', re: /(^|\.)streamable\.com$/ },
];
const platformByName = (n) => PLATFORMS.find((p) => p.name === n || p.label === n);
function platformOfUrl(u) {
  try { const h = new URL(u).hostname.toLowerCase(); return PLATFORMS.find((p) => p.re.test(h)) || null; } catch { return null; }
}
function setPlatform(p) {
  document.documentElement.style.setProperty('--pf', p?.color || 'var(--ac)');
  document.querySelectorAll('.pill').forEach((el) => el.classList.toggle('on', el.dataset.name === p?.name));
}

const ICONS = {
  moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  ok: '<path d="M5 12l5 5L20 7"/>',
  err: '<path d="M12 8v5M12 17h.01"/>',
  run: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  wait: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  dl: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  video: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9v6l5-3z"/>',
  wave: '<path d="M3 12h1M7 8v8M11 4v16M15 7v10M19 10v4"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
};
const svg = (name, size = 18, sw = 2.2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }

function fmtDur(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function fmtSize(b) {
  if (!b) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i > 1 ? 1 : 0).replace('.', ',')} ${u[i]}`;
}
function fmtCount(n) { return new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 }).format(n); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function mediaLink(url, name) { return `/api/media?u=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}`; }
function fileBase(s) { return String(s || 'arquivo').replace(/\s+/g, ' ').trim().slice(0, 80); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Erro ${r.status}`);
  return j;
}

$('#sites').innerHTML = PLATFORMS.map((p) => `<span class="pill" data-name="${p.name}" style="--c:${p.color}"><i></i>${p.label || p.name}</span>`).join('')
  + '<span class="pill">e mais</span>';

// ---------- tema ----------
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintTheme() {
  $('#themeIco').innerHTML = ICONS[isDark() ? 'sun' : 'moon'];
  document.querySelector('meta[name=theme-color]').content = isDark() ? '#1b1e25' : '#e9edf2';
}
$('#theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gc-theme', next); } catch {}
  paintTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
paintTheme();

// ---------- buscar ----------
let seq = 0;
async function lookup(url) {
  url = url.trim();
  if (!url || url === state.url) return;
  const my = ++seq;
  state.url = url;
  const p = platformOfUrl(url);
  setPlatform(p);
  $('#formErr').hidden = true;
  $('#post').hidden = true;
  $('#profile').hidden = true;
  $('#loadingText').textContent = p ? `Buscando no ${p.name}…` : 'Buscando…';
  $('#loading').hidden = false;
  try {
    const info = await api('/api/info', { method: 'POST', body: JSON.stringify({ url }) });
    if (my !== seq) return;
    state.info = info;
    setPlatform(platformByName(info.platform) || p);
    if (info.type === 'profile') renderProfile();
    else {
      const first = info.items.findIndex((it) => it.kind !== 'image');
      selectItem(first >= 0 ? first : 0);
    }
  } catch (e) {
    if (my !== seq) return;
    state.url = '';
    $('#formErr').textContent = e.message;
    $('#formErr').hidden = false;
  } finally {
    if (my === seq) $('#loading').hidden = true;
  }
}

$('#form').addEventListener('submit', (e) => { e.preventDefault(); lookup($('#url').value); });
$('#url').addEventListener('paste', () => setTimeout(() => lookup($('#url').value), 0));
$('#url').addEventListener('change', () => lookup($('#url').value));
$('#url').addEventListener('input', () => setPlatform(platformOfUrl($('#url').value)));
$('#paste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    $('#url').value = t;
    lookup(t);
  } catch { $('#url').focus(); }
});

// ---------- post ----------
const KIND_NAME = { image: 'Foto', video: 'Vídeo', audio: 'Áudio' };
const cur = () => state.info.items[state.sel];
const nameFor = (i, n) => fileBase(`${i.uploader || i.platform} - ${i.id || 'post'}${i.items.length > 1 ? ` - ${n + 1}` : ''}`);

function selectItem(n) {
  state.sel = n;
  state.variant = 0;
  const it = cur();
  if (it.kind === 'audio') state.kind = 'mp3';
  else if (it.kind === 'video') {
    if (!it.native || !it.hasAudio) state.kind = 'mp4';
    if (it.native && it.heights?.length) state.quality.mp4 = it.heights.includes(1080) ? 1080 : it.heights[0];
  }
  renderPost();
}

function itemTag(it) {
  const bits = [it.gif ? 'GIF' : KIND_NAME[it.kind]];
  if (it.duration) bits.push(fmtDur(it.duration));
  else if (it.width && it.height) bits.push(`${it.width}×${it.height}`);
  return bits.join(' · ');
}

function renderPost() {
  const i = state.info;
  const it = cur();
  const multi = i.items.length > 1;

  // Cabeçalho
  const cover = it.thumb || i.thumbnail || '';
  $('#pCover').src = cover;
  $('#pCover').hidden = !cover;
  $('#pDur').textContent = fmtDur(it.duration || i.duration);
  $('#pDur').hidden = !(it.duration || i.duration);
  $('#pTitle').textContent = i.title || `Post de ${i.uploader}`;
  const base = nameFor(i, state.sel);
  $('#pWho').innerHTML = [
    i.avatar ? `<img src="${esc(i.avatar)}" alt="" referrerpolicy="no-referrer">` : '',
    `<span>${esc([i.platform, i.uploader].filter(Boolean).join(' · '))}</span>`,
    i.avatar ? `<a class="k" href="${esc(mediaLink(i.avatar, `${fileBase(i.uploader || i.platform)} - foto de perfil`))}" download>Baixar foto de perfil</a>` : '',
  ].join('');

  // Galeria (post com vários itens ou com foto)
  const showGallery = multi || it.kind === 'image';
  $('#gallerySec').hidden = !showGallery;
  if (showGallery) {
    const photos = i.items.filter((x) => x.kind === 'image').length;
        const count = (k, one, many) => { const c = i.items.filter((x) => x.kind === k).length; return c ? `${c} ${c > 1 ? many : one}` : ''; };
    const parts = [count('image', 'foto', 'fotos'), count('video', 'vídeo', 'vídeos'), count('audio', 'áudio', 'áudios')].filter(Boolean);
    $('#galleryLabel').textContent = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} e ${parts.at(-1)}` : parts[0];
    $('#allPhotos').hidden = photos < 2;
    $('#allPhotos').innerHTML = `${svg('dl', 14)}Baixar ${photos} fotos`;
    $('#gallery').innerHTML = i.items.map((x, n) => {
      const pic = x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : svg(x.kind === 'audio' ? 'music' : 'image', 30, 1.6);
      const action = x.kind === 'image'
        ? `<a class="k" href="${esc(mediaLink(x.url, nameFor(i, n)))}" download>${svg('dl', 15)}Baixar foto</a>`
        : `<span class="k">${n === state.sel ? 'Selecionado' : 'Converter'}</span>`;
      return `<div class="tile${n === state.sel && x.kind !== 'image' ? ' sel' : ''}" data-n="${n}" ${x.kind !== 'image' ? 'role="button" tabindex="0"' : ''} style="animation-delay:${n * 40}ms">
        <div class="pic">${pic}${x.kind !== 'image' ? `<span class="play">${svg(x.kind === 'audio' ? 'music' : 'play', 16)}</span>` : ''}<span class="tag">${esc(itemTag(x))}</span></div>
        ${action}
      </div>`;
    }).join('');
  }

  // Conversor do item selecionado
  const canConvert = it.kind !== 'image';
  $('#convert').hidden = !canConvert;
  if (canConvert) renderConvert(it, base, multi);

  // Capas (vídeo do YouTube e afins)
  const thumbs = !multi && it.native ? (i.thumbs || []) : [];
  $('#thumbsSec').hidden = thumbs.length === 0;
  $('#thumbs').innerHTML = thumbs.map((t) =>
    `<a class="k" href="${esc(mediaLink(t.url, `${fileBase(i.title)} - capa ${t.label}`))}" download>${esc(t.label)} <small>${esc(t.size)}</small></a>`).join('');

  $('#post').hidden = false;
}

function renderConvert(it, base, multi) {
  const avail = { mp4: it.kind === 'video', mp3: it.hasAudio, wav: it.hasAudio };
  if (!avail[state.kind]) state.kind = Object.keys(avail).find((k) => avail[k]) || 'mp4';
  $('#convertLabel').hidden = !multi;
  $('#convertLabel').textContent = `Item ${state.sel + 1} de ${state.info.items.length}: ${KIND_NAME[it.kind].toLowerCase()}`;

  const tabs = [['mp4', 'MP4', 'video'], ['mp3', 'MP3', 'music'], ['wav', 'WAV', 'wave']].filter(([k]) => avail[k]);
  const tabEl = document.querySelector('.tabs');
  tabEl.style.gridTemplateColumns = `repeat(${tabs.length}, minmax(0, 1fr))`;
  tabEl.innerHTML = tabs.map(([k, label, ico]) =>
    `<button class="k" type="button" role="tab" data-kind="${k}" aria-selected="${k === state.kind}">${svg(ico, 22, 2)}${label}</button>`).join('');

  const chips = $('#chips');
  const note = $('#note');
  note.hidden = true;
  let go = '';
  if (state.kind === 'mp4' && it.native) {
    $('#qLabel').textContent = 'Resolução';
    chips.innerHTML = it.heights.map((h) =>
      `<button class="k" type="button" data-q="${h}" aria-pressed="${h === state.quality.mp4}">${h ? `${h}p` : 'Melhor qualidade'}${RES_NAMES[h] ? ` <small>${RES_NAMES[h]}</small>` : ''}</button>`).join('');
    if (state.quality.mp4 > 1080) {
      note.textContent = 'Acima de 1080p o vídeo vem em VP9/AV1: toca no celular e no VLC, mas editores antigos podem não abrir.';
      note.hidden = false;
    }
    go = `<button class="cta" type="button" id="go">${svg('dl', 20, 2.4)}Converter pra MP4${state.quality.mp4 ? ` ${state.quality.mp4}p` : ''}</button>`;
  } else if (state.kind === 'mp4') {
    // Vídeo direto: já é MP4, só escolhe a versão e baixa.
    const vs = it.variants?.length ? it.variants : [{ url: it.url }];
    if (state.variant >= vs.length) state.variant = 0;
    $('#qLabel').textContent = vs.length > 1 ? 'Versão' : 'Qualidade';
    chips.innerHTML = vs.map((v, n) =>
      `<button class="k" type="button" data-v="${n}" aria-pressed="${n === state.variant}">${esc(v.label || (v.height ? `${v.height}p` : 'Original'))}${n === 0 && vs.length > 1 ? ' <small>melhor</small>' : ''}</button>`).join('');
    if (state.info.platform === 'TikTok') { note.textContent = 'Sem marca d\'água.'; note.hidden = false; }
    go = `<a class="cta" href="${esc(mediaLink(vs[state.variant].url, base))}" download>${svg('dl', 20, 2.4)}Baixar MP4</a>`;
  } else if (state.kind === 'mp3') {
    $('#qLabel').textContent = 'Qualidade';
    chips.innerHTML = ['320', '256', '192', '128'].map((q) =>
      `<button class="k" type="button" data-q="${q}" aria-pressed="${q === state.quality.mp3}">${q} kbps</button>`).join('');
    go = `<button class="cta" type="button" id="go">${svg('dl', 20, 2.4)}Converter pra MP3</button>`;
    if (it.kind === 'audio' && !it.native && it.url) {
      go += `<a class="k" style="width:100%;margin-top:12px" href="${esc(mediaLink(it.url, base))}" download>Baixar o áudio original</a>`;
    }
  } else {
    $('#qLabel').textContent = 'Qualidade';
    chips.innerHTML = '<button class="k" type="button" aria-pressed="true">Sem perda <small>PCM 16-bit</small></button>';
    note.textContent = 'WAV é pesado: uns 10 MB por minuto.';
    note.hidden = false;
    go = `<button class="cta" type="button" id="go">${svg('dl', 20, 2.4)}Converter pra WAV</button>`;
  }
  $('#goWrap').innerHTML = go;
}

$('#gallery').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const t = e.target.closest('.tile[role=button]');
  if (t) selectItem(Number(t.dataset.n));
});
$('#gallery').addEventListener('keydown', (e) => {
  const t = e.target.closest('.tile[role=button]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectItem(Number(t.dataset.n)); }
});
$('#allPhotos').addEventListener('click', async () => {
  const i = state.info;
  for (const [n, x] of i.items.entries()) {
    if (x.kind !== 'image') continue;
    triggerDownload(mediaLink(x.url, nameFor(i, n)));
    await new Promise((r) => setTimeout(r, 700));
  }
});
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-kind]');
  if (!b) return;
  state.kind = b.dataset.kind;
  renderPost();
});
$('#chips').addEventListener('click', (e) => {
  const v = e.target.closest('[data-v]');
  if (v) { state.variant = Number(v.dataset.v); return renderPost(); }
  const b = e.target.closest('[data-q]');
  if (!b) return;
  state.quality[state.kind] = state.kind === 'mp4' ? Number(b.dataset.q) : b.dataset.q;
  renderPost();
});

// ---------- perfil ----------
function renderProfile() {
  const c = state.info;
  const fans = c.platform === 'YouTube' ? 'inscritos' : 'seguidores';
  $('#cName').textContent = c.title;
  $('#cMeta').textContent = [c.platform, c.handle, c.followers ? `${fmtCount(c.followers)} ${fans}` : ''].filter(Boolean).join(' · ');
  $('#cBanner').className = `banner${c.banner ? '' : ' none'}`;
  $('#cBanner').innerHTML = c.banner ? `<img src="${esc(c.banner)}" alt="" referrerpolicy="no-referrer">` : '';
  $('#cAvatar').innerHTML = c.avatar ? `<img src="${esc(c.avatar)}" alt="" referrerpolicy="no-referrer">` : '<span></span>';
  const who = fileBase(c.handle || c.title);
  const av = $('#cAvatarBtn'), bn = $('#cBannerBtn');
  av.hidden = !c.avatar;
  bn.hidden = !c.banner;
  if (c.avatar) av.href = mediaLink(c.avatar, `${who} - foto de perfil`);
  if (c.banner) bn.href = mediaLink(c.banner, `${who} - banner`);
  $('#profile').hidden = false;
}

// ---------- conversões ----------
$('#goWrap').addEventListener('click', async (e) => {
  const btn = e.target.closest('#go');
  if (!btn) return;
  btn.disabled = true;
  const i = state.info;
  const it = cur();
  const title = fileBase(i.items.length > 1 ? `${i.title} (${state.sel + 1})` : i.title);
  try {
    const job = await api('/api/jobs', {
      method: 'POST',
      body: JSON.stringify({ url: state.url, item: state.sel, kind: state.kind, quality: state.quality[state.kind], title }),
    });
    job.platform = i.platform;
    state.jobs.unshift(job);
    saveJobs();
    renderJobs();
    poll();
  } catch (err) {
    alert(err.message);
  } finally {
    btn.disabled = false;
  }
});

function jobLabel(j) {
  const k = j.kind === 'mp4' ? (j.quality ? `MP4 ${j.quality}p` : 'MP4') : j.kind === 'mp3' ? `MP3 ${j.quality}` : 'WAV';
  return j.platform ? `${j.platform} · ${k}` : k;
}

function saveJobs() {
  store('gc-jobs', state.jobs.filter((j) => j.status !== 'expired').slice(0, 30));
}

function renderJobs() {
  const list = state.jobs;
  $('#empty').hidden = list.length > 0;
  $('#clear').hidden = !list.some((j) => !ACTIVE.includes(j.status));
  $('#jobs').innerHTML = list.map((j) => {
    const active = ACTIVE.includes(j.status);
    const busy = j.status === 'queued' || (j.status === 'running' && (j.percent >= 100 || j.percent === 0));
    let ico = 'wait', cls = '', sub = `${jobLabel(j)} · ${esc(j.phase)}`;
    if (j.status === 'running') {
      ico = 'run'; cls = 'run';
      if (j.percent > 0 && j.percent < 100) sub = `${jobLabel(j)} · ${j.speed ? esc(j.speed) : esc(j.phase)}${j.eta ? ' · falta ' + esc(j.eta) : ''}`;
    }
    if (j.status === 'done') { ico = 'ok'; cls = 'ok'; sub = `${jobLabel(j)} · ${fmtSize(j.size)}`; }
    if (j.status === 'error') { ico = 'err'; cls = 'err'; sub = esc(j.error); }
    if (j.status === 'canceled') { ico = 'x'; sub = `${jobLabel(j)} · cancelado`; }
    if (j.status === 'expired') { ico = 'wait'; sub = `${jobLabel(j)} · expirou`; }
    const pct = j.status === 'running' && j.percent > 0 && j.percent < 100 ? `<span class="job-pct">${j.percent.toFixed(0)}%</span>` : '';
    const action = j.status === 'done'
      ? `<a class="k icon-btn" href="/api/jobs/${j.id}/file" download aria-label="Baixar">${svg('dl')}</a>`
      : active ? `<button class="k icon-btn" type="button" data-cancel="${j.id}" aria-label="Cancelar">${svg('x', 16)}</button>` : '';
    return `<div class="job">
      <div class="job-row">
        <div class="job-ico ${cls}">${svg(ico)}</div>
        <div class="job-main"><div class="job-name">${esc(j.title)}</div><div class="job-sub${j.status === 'error' ? ' err' : ''}">${sub}</div></div>
        ${pct}${action}
      </div>
      ${active ? `<div class="track${busy ? ' busy' : ''}"><i style="width:${j.percent || 0}%"></i></div>` : ''}
    </div>`;
  }).join('');
}

$('#jobs').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-cancel]');
  if (!b) return;
  b.disabled = true;
  await api(`/api/jobs/${b.dataset.cancel}`, { method: 'DELETE' }).catch(() => {});
});

$('#clear').addEventListener('click', () => {
  state.jobs = state.jobs.filter((j) => ACTIVE.includes(j.status));
  saveJobs();
  renderJobs();
});

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  while (state.jobs.some((j) => ACTIVE.includes(j.status) || j.recheck)) {
    for (const j of state.jobs.filter((j) => ACTIVE.includes(j.status) || j.recheck)) {
      try {
        const upd = await api(`/api/jobs/${j.id}`);
        const wasDone = j.status === 'done';
        const fresh = !j.recheck;
        Object.assign(j, upd);
        delete j.recheck;
        if (fresh && !wasDone && j.status === 'done') triggerDownload(`/api/jobs/${j.id}/file`);
      } catch {
        j.status = 'expired';
        delete j.recheck;
      }
    }
    saveJobs();
    renderJobs();
    await new Promise((r) => setTimeout(r, 1000));
  }
  polling = false;
}

function triggerDownload(href) {
  const a = document.createElement('a');
  a.href = href;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// Lista salva no navegador: reconfere no servidor o que ainda existe.
state.jobs = load('gc-jobs', []).map((j) => ({ ...j, recheck: true }));
renderJobs();
if (state.jobs.length) poll();

// Aceita ?url=... (e o "Compartilhar" do celular quando instalado como app)
const qs = new URLSearchParams(location.search);
const shared = (qs.get('url') || qs.get('text') || '').match(/https?:\/\/\S+/);
if (shared) { $('#url').value = shared[0]; lookup(shared[0]); history.replaceState(null, '', '/'); }
</script>
